channels:
  email:
    enabled: true
    provider: "smtp"             # Google Workspace mailbox via app password (works in a Codespace; Gmail OAuth needs a local browser)
    max_daily_sends: 30          # a ceiling, not a target. Start small.
    require_approval: true       # every email waits in the Outbox for Amber. Keep this on.
    link_domains: ["10sec.space", "calendly.com"]
    send_to_risky: false
    min_write_score: 60          # only write to strong fits
    max_bounce_rate: 0.03        # pause everything if bounces pass 3%
    warmup:
      start_date: ""             # >>> FILL IN: YYYY-MM-DD the day warmup starts on the new mailbox
      min_days: 14
      start_sends: 5
      daily_increase: 3
      dkim_selector: ""
    send_window:
      start: "10:00"
      end: "18:00"
      weekdays_only: true
      recipient_timezone: true
    signature:
      logo: ""                   # plain text lands better for cold email. Leave blank.
      width: 120
      alt: ""
      link: ""
      direction: "auto"
  linkedin:
    enabled: false               # stays off (ToS risk, and LinkedIn is skipped for now)
    max_daily_connections: 20
    max_daily_messages: 10

usage:
  max_daily_claude_percent: 50   # leaves half of the Claude plan for Amber's own work
  heartbeat_interval_minutes: 15
  quiet_hours:
    start: "22:00"
    end: "08:00"
    timezone: "Asia/Kolkata"

compliance:
  postal_address: ""             # >>> FILL IN: a business address or virtual mailbox. Required by US law, good practice everywhere.
  opt_out_line: "Not useful right now? Just say so and I won't email again."
  do_not_contact: []             # add competitors, friends, anyone you never want emailed
  precleared:
    enabled: false               # Precleared doesn't list India as a sender country yet

writer:
  email_rules: "skills/email_rules.md"
  site_facts: true
  require_tip: true              # no real observation from their site = no email
