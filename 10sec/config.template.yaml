# ============================================================
# 10sec · Sellbird config TEMPLATE (copied to ./sellbird.local.yaml by 10sec/setup.sh)
# TEMPLATE. The Codespace copies it to ./sellbird.local.yaml (gitignored). Edit that copy,
# not this file: this repo is public. The root copy wins over
# sellbird.yaml and git never touches it.
# Anything marked  >>> FILL IN  needs a decision from Amber first.
# ============================================================

persona:
  name: "Amber Kujur"
  company: "10sec"
  role: "Founder"
  email: "amber@SENDING-DOMAIN"          # >>> FILL IN: mailbox on the separate sending domain
  linkedin: ""                           # LinkedIn skipped on purpose
  tone: "warm, sharp and specific; curious like a lab, never salesy; one light touch of wit at most"

product:
  name: "10sec"
  description: >-
    10sec is a new creative lab from India that designs websites, social media and
    search visibility (SEO + AEO) to win the first 10 seconds. A new visitor decides
    whether to stay in about that long, so every homepage we build answers four
    questions fast: what is this, is it for me, can I trust it, what do I do next.
    For small businesses, D2C brands and startup founders who want enquiries,
    not vanity metrics, and one partner instead of three vendors.
  pricing: "Never quote or hint at a price in email. Every project gets a fixed quote after a free 30-minute intro call."
  key_benefits:
    - "Homepages built to pass the 10-second test: what is this, is it for me, can I trust it, what next"
    - "SEO-friendly and AEO-ready from day one, with schema so Google and AI assistants can read and cite the business"
    - "Redesigns and migrations that keep rankings: every old URL mapped and 301-redirected in one hop"
    - "Website, social and search run from one plan, one voice and one point of contact"
    - "The client owns the domain, site, accounts, content and code"
  objection_responses:
    "too expensive": "Fair. There's no fixed price list because every quote is fixed to the actual scope. The free test costs nothing and is useful on its own, even if we never work together."
    "already have an agency": "Makes sense. The 10-second test is still a free second opinion. If it agrees with your current team, that's good news too."
    "already have a website": "That's exactly why I wrote. It's not about replacing it, just whether a stranger gets it in 10 seconds. Small fixes often matter more than a rebuild."
    "not interested": "No problem at all, I won't email again. Good luck with the season."
    "send me details": "Happy to. The quickest useful thing is the free 10-second test of your homepage: five plain bullets, no deck. Want it?"
    "are you an ai": "Answer truthfully: Amber uses an AI assistant to help research and draft emails, and she reads and approves what goes out."
  offer:
    primary: "Website design, social media marketing and SEO + AEO, each quoted as a fixed price after a free intro call"
    entry: "A free 10-second test of their homepage: five plain bullets on what a first-time visitor gets, and misses, in the first 10 seconds"
    goal: "book_call"
    booking_method: "calendar_link"
    booking_url: "https://calendly.com/amber-10sec/30min"
    meeting_duration: "30 minutes"
    meeting_owner: "Amber Kujur"

